name: Deploy S3 bucket with IAC scan enforcement

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - apply
          - destroy
      bucket_name:
        description: 'S3 Bucket Name (must be globally unique)'
        required: true
        type: string
      aws_region:
        description: 'AWS Region'
        required: true
        type: string
        default: 'us-west-2'
      override_fcs:
        description: 'Override FCS scan failure and apply CloudFormation anyway'
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Download and Setup FCS CLI
        id: fcs-setup
        if: inputs.action == 'apply'
        env:
          FCS_CLIENT_ID: ${{ vars.FCS_CLIENT_ID }}
          FCS_CLIENT_SECRET: ${{ secrets.FCS_CLIENT_SECRET }}
          FALCON_REGION: ${{ vars.FALCON_REGION }}
          FCS_BIN_PATH: /home/runner/.local/bin/fcs        
        run: |
          chmod +x ./fcs_download_standalone.sh
          ./fcs_download_standalone.sh

      - name: Run FCS IaC Scan
        id: fcs
        if: inputs.action == 'apply'
        run: |
          export FCS_EXIT_CODE=0
          /home/runner/.local/bin/fcs/fcs scan iac --path ./iac-scan --fail-on "critical=1,high=1,medium=1,informational=1" --report-formats "sarif" --output-path ./iac-scan-results.sarif --upload --client-id "${{ vars.FCS_CLIENT_ID }}" --client-secret "${{ secrets.FCS_CLIENT_SECRET }}" --falcon-region "${{ vars.FALCON_REGION }}" || export FCS_EXIT_CODE=$?
          echo "exit-code=$FCS_EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Upload IaC scan results
        if: always() && inputs.action == 'apply'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: iac-scan-results
          path: ./iac-scan-results.sarif
          if-no-files-found: warn
          retention-days: 3

      # - name: Upload SARIF report to GitHub Code scanning
      #   uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 #v4.38.0
      #   if: always()
      #   with:
      #     sarif_file: ./iac-scan-results.sarif
      #     category: "fcs_iac_scanning"

      - name: FCS Scan Failure - Block Deployment
        if: |
          inputs.action == 'apply' &&
          steps.fcs.outputs.exit-code != '0' &&
          inputs.override_fcs == 'false'
        run: |
          echo "::error::FCS scan has discovered misconfigurations on the IAC code. Deployment blocked. Review FCS scan results and remediate before deploying, or re-run with override_fcs=true to bypass."
          exit 1

      - name: FCS Scan Failure - Override Warning
        if: |
          inputs.action == 'apply' &&
          steps.fcs.outputs.exit-code != '0' &&
          inputs.override_fcs == 'true'
        run: |
          echo "::warning::FCS scan discovered misconfigurations but override_fcs=true. Proceeding with deployment despite scan failures."

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c #v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Apply CloudFormation Stack
        if: |
          inputs.action == 'apply' &&
          (steps.fcs.outputs.exit-code == '0' || inputs.override_fcs == 'true')
        run: |
          aws cloudformation deploy \
            --template-file ./iac-scan/s3.yaml \
            --stack-name public-s3-bucket-stack \
            --parameter-overrides BucketName=${{ inputs.bucket_name }} \
            --region ${{ inputs.aws_region }} \
            --no-fail-on-empty-changeset

      - name: Destroy CloudFormation Stack
        if: inputs.action == 'destroy'
        run: |
          aws cloudformation delete-stack \
            --stack-name public-s3-bucket-stack \
            --region ${{ inputs.aws_region }}
          
          aws cloudformation wait stack-delete-complete \
            --stack-name public-s3-bucket-stack \
            --region ${{ inputs.aws_region }}

      - name: Output Results
        if: |
          inputs.action == 'apply' &&
          (steps.fcs.outputs.exit-code == '0' || inputs.override_fcs == 'true')
        run: |
          aws cloudformation describe-stacks \
            --stack-name public-s3-bucket-stack \
            --region ${{ inputs.aws_region }} \
            --query 'Stacks[0].Outputs' \
            --output table
