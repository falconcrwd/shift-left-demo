name: FCS Image Scanning with Enforcement

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./image-scan
          file: ./image-scan/Dockerfile
          tags: crwd/ubuntuweb:latest
          push: false
          load: true

      - name: Download and Setup FCS CLI
        id: fcs-setup
        env:
          FCS_CLIENT_ID: ${{ vars.FCS_CLIENT_ID }}
          FCS_CLIENT_SECRET: ${{ secrets.FCS_CLIENT_SECRET }}
          FALCON_REGION: ${{ vars.FALCON_REGION }}
          FCS_BIN_PATH: /home/runner/.local/bin/fcs        
        run: |
          chmod +x ./fcs_download_standalone.sh
          ./fcs_download_standalone.sh

      - name: Run FCS Image Scan
        id: fcs
        run: |
          export FCS_EXIT_CODE=0
          /home/runner/.local/bin/fcs/fcs scan image crwd/ubuntuweb:latest --output ./image-scan-results.json --format json --upload --client-id "${{ vars.FCS_CLIENT_ID }}" --client-secret "${{ secrets.FCS_CLIENT_SECRET }}" --falcon-region "${{ vars.FALCON_REGION }}" || export FCS_EXIT_CODE=$?
          echo "exit-code=$FCS_EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Verify image was built
        run: |
          docker images | grep crwd/ubuntuweb